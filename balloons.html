<div class="heading"><span class="eyebrow">LET’S COLOR THE MUSIC</span><h1>给气球穿上颜色</h1><p class="subtitle">Balloon Notes</p></div>
<section class="instructions" aria-label="练习说明"><p>把间音涂成红色，把线音涂成蓝色。</p><p lang="en">Color the space notes red and the line notes blue.</p><button id="speak" type="button">▶ 听一听</button><p id="speech-status" role="status"></p></section>
