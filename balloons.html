<div class="heading"><span class="eyebrow">LET’S COLOR THE MUSIC</span><h1>给气球穿上颜色</h1><p class="subtitle">Balloon Notes</p></div>
<section class="instructions" aria-label="练习说明"><p>把间音涂成红色，把线音涂成蓝色。</p><p lang="en">Color the space notes red and the line notes blue.</p><button id="speak" type="button">▶ 听题干</button><p id="speech-status" role="status"></p></section>
<div class="toolbar"><div class="paints" role="group" aria-label="选择画笔"><button data-color="red" aria-pressed="true"><i class="red"></i>红色 · 间音<span>Space notes</span></button><button data-color="blue" aria-pressed="false"><i class="blue"></i>蓝色 · 线音<span>Line notes</span></button><button data-color="erase" aria-pressed="false" aria-label="橡皮擦 Eraser"><img class="eraser-icon" src="assets/eraser.svg" alt="" aria-hidden="true">橡皮擦<span>Eraser</span></button></div><p>先选颜色，再点气球，完成请打勾<br><span>Pick a color, then tap a balloon.</span></p></div>
<section class="paper" aria-label="气球练习纸"><div class="cloud cloud-one" id="student-label"></div><div class="cloud cloud-two">已涂 <strong id="count">0</strong> / 12</div><div id="balloons"></div></section>
<footer><p id="feedback" role="status" aria-live="polite">慢慢观察：音符在线上，还是在两条线之间？</p><div><button id="check" class="primary">✓ 完成 · Done</button><button id="next">换一张 · New page ↻</button></div><small>保留原作手绘气球 · 每张练习重新生成音符位置</small></footer>
