<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <title>五线谱竞走 · 音乐游乐工坊</title>
    <link rel="stylesheet" href="studio.css" />
    <link rel="stylesheet" href="staff_race.css" />
  </head>
  <body>
    <header>
      <a href="index.html">← 音乐游乐工坊</a>
      <button id="reset" type="button">重新开局</button>
    </header>
    <main>
      <h1>五线谱竞走</h1>
      <p class="intro">两人轮流掷骰子，沿着线和间逐格走。</p>
      <section id="setup" aria-labelledby="choose-player">
        <h2 id="choose-player">为学生选棋子</h2>
        <div class="role-switch" role="group" aria-label="选棋子的玩家">
          <button type="button" data-player="0">学生</button>
          <button type="button" data-player="1">老师 / 家长</button>
        </div>
        <div id="characters" aria-label="四个音符角色"></div>
        <p id="choices" role="status"></p>
        <button id="start" type="button">开始比赛</button>
      </section>
      <div class="race">
        <section class="controls" aria-label="回合与棋子位置">
          <div class="scores">
            <div class="score" id="score-0"><span></span><strong></strong></div>
            <div class="score" id="score-1"><span></span><strong></strong></div>
          </div>
          <div class="turn-row"><h2 id="turn"></h2><span id="round"></span></div>
          <div class="roll-panel">
            <button id="roll" type="button" aria-describedby="turn"><span aria-hidden="true">🎲</span> 掷骰子</button>
            <div class="die" id="die" hidden>
              <span id="direction"></span><strong id="distance"></strong>
            </div>
          </div>
          <p id="feedback" role="status" aria-atomic="true"></p>
        </section>
        <section class="board" aria-label="五线谱棋盘">
          <div class="board-heading"><span>↑ 向上</span><span>线和间各占一格</span></div>
          <div id="staff" role="group" aria-label="从下加一间到上加一间的棋盘"><div class="row ledger-guide" aria-hidden="true"><span class="cell-name">上加一线</span><span class="ledger-left"></span><span class="ledger-right"></span></div><div id="lower-ledger" class="row ledger-guide" aria-hidden="true"><span class="cell-name">下加一线</span><span class="ledger-left"></span><span class="ledger-right"></span></div></div>
          <div class="board-heading"><span>↓ 向下</span><span>从最下面开始数线和间</span></div>
        </section>
      </div>
      <details>
        <summary>怎么玩？</summary>
        <ol>
          <li>两人各选一个角色，从下加一间出发，向上加一间进发。</li>
          <li>骰子会告诉你向上还是向下，以及要走几步。每次点相邻的一格。比如从第二线向上走两步，先点第二间，再点第三线。</li>
          <li>骰子只会掷出棋盘上走得完的方向和步数。走完再换人。</li>
          <li>先到上加一间的人立即获胜。每轮两人各走一次，十轮结束时，站得更高的人赢。同一高度就打平。</li>
        </ol>
      </details>
    </main>
    <script type="module" src="src/staff_race.mjs"></script>
  </body>
</html>
