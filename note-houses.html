<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <title>音符小镇 · 音乐游乐工坊</title>
    <link rel="stylesheet" href="note-houses.css" />
  </head>
  <body>
    <header>
      <a href="activities.html">← 音乐游乐工坊</a><span>NOTE NEIGHBORHOOD</span
      ><button id="sound" aria-label="朗读当前题目">♪ 听题干</button>
    </header>
    <main>
      <section class="intro">
        <div>
          <p class="eyebrow">七位朋友 · 七个家</p>
          <h1>音符小镇</h1>
        </div>
        <nav aria-label="选择难度">
          <button id="level1" aria-pressed="true">1 · 送音符回家</button
          ><button id="level2" aria-pressed="false">2 · 谁是我的邻居？</button>
        </nav>
      </section>
      <section class="question" aria-labelledby="prompt">
        <div>
          <h2 id="prompt"></h2>
          <p id="instruction"></p>
        </div>
        <span id="progress"></span><button id="reset">↻ 重新开始</button>
      </section>
      <section class="town" aria-label="大谱表上的七座房屋">
        <div class="scene-tools">
          <span>每一个线或间，都是一层楼。</span><span>线与间，一眼看全</span>
        </div>
        <div class="staff-scroll" aria-label="完整展示的大谱表">
          <svg
            id="staff"
            viewBox="0 -40 1200 1120"
            aria-label="高低音大谱表，七座房屋从左向右逐格上行"
          ></svg>
        </div>
        <p class="scene-caption">
          <a
            class="piano-credit"
            href="assets/piano_attribution.txt"
            target="_blank"
            rel="noopener"
            aria-label="钢琴采样署名与许可"
            >Piano: Alexander Holm · CC BY 3.0</a
          >
          · 小屋在线上，或完整住在两条线之间。找找每位朋友的家。
        </p>
      </section>
      <section class="answer-dock" aria-label="选择音符">
        <div class="dock-heading">
          <strong id="dock-label">谁要回家？</strong>
          <p id="feedback" role="status" aria-live="polite"></p>
        </div>
        <div id="characters"></div>
        <button id="next" hidden>下一题 →</button>
      </section>
      <dialog id="celebration">
        <div class="finish-art" aria-hidden="true">♫</div>
        <h2>小镇热闹起来啦！</h2>
        <p id="finish-copy"></p>
        <button id="again">再玩一次</button
        ><button id="continue">去找邻居 →</button
        ><button id="close-finish">回小镇看看</button>
      </dialog>
    </main>
    <script type="module" src="src/note_houses.mjs"></script>
  </body>
</html>
